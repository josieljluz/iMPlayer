name: Download Playlists and EPGs

on:
  workflow_dispatch:  # Permite execução manual
  schedule:
    - cron: '0 0 * * *'  # Executa diariamente à meia-noite UTC

jobs:
  download-media:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests tzdata

    - name: Set timezone to America/Fortaleza
      run: |
        sudo timedatectl set-timezone America/Fortaleza
        echo "Timezone set to $(timedatectl | grep "Time zone")"

    - name: Run media downloader
      run: python media_downloader.py

    - name: Add timestamp to files
      run: |
        export TZ=America/Fortaleza
        for file in playlists/*.m3u epg/*.xml.gz iMPlayer/*; do
          if [ -f "$file" ]; then
            echo "# Atualizado em $(date '+%d/%m/%Y %H:%M:%S %Z')" >> "$file"
          fi
        done

    - name: Commit changes
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git add .
        git diff-index --quiet HEAD || git commit -m "Atualização automática dos arquivos baixados (playlists.m3u) - $(date -d 'now' '+%d/%m/%Y %H:%M:%S') - America/Fortaleza"
        git push

    - name: Upload logs
      uses: actions/upload-artifact@v3
      with:
        name: download-logs
        path: media_downloader.log
