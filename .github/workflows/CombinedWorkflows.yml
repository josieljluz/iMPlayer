name: Combined Workflows

on:
  schedule:
    - cron: '1 3 2-30/2 * *'  # Horário do playlists.yml
    - cron: '1 3 1-31/2 * *'  # Horário do iMPlayer.yml e playlists.m3u.yml
  workflow_dispatch:  # Permite execução manual

jobs:
  playlists:
    name: Executar playlists
    if: github.event.schedule == '1 3 2-30/2 * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repositório
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.8'

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Executar script de playlists
      run: python playlists.py

    - name: Atualizar timestamp nos arquivos baixados
      run: |
        for file in $(find playlists -type f); do
          echo "# Atualizado em $(date)" >> "$file"
        done

    - name: Confirmar arquivos baixados
      run: ls -la playlists

    - name: Verificar mudanças no Git
      id: git_status
      run: |
        if [[ -n "$(git status --porcelain)" ]]; then
          echo "changes=true" >> $GITHUB_ENV
        else
          echo "changes=false" >> $GITHUB_ENV
        fi

    - name: Commit e push do arquivo baixado (se houver mudanças)
      if: env.changes == 'true'
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add playlists/
        git commit -m "Atualização automática dos arquivos baixados (playlists)"
        git pull --rebase origin main
        git push https://x-access-token:${{ secrets.MY_DOWNLOAD_GITHUB_TOKEN }}@github.com/josieljluz/iMPlayer.git main

  implayer:
    name: Executar iMPlayer
    if: github.event.schedule == '1 3 1-31/2 * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: playlists  # Opcional: depende da conclusão do job playlists

    steps:
    - name: Checkout repositório
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.8'

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Executar script de iMPlayer
      run: python iMPlayer.py

    - name: Atualizar timestamp nos arquivos baixados
      run: |
        echo "# Atualizado em $(date)" >> iMPlayer/iMPlayer_1.m3u
        echo "# Atualizado em $(date)" >> iMPlayer/iMPlayer_1.xml.gz
        echo "# Atualizado em $(date)" >> iMPlayer/iMPlayer_2.m3u
        echo "# Atualizado em $(date)" >> iMPlayer/iMPlayer_2.xml.gz
        echo "# Atualizado em $(date)" >> iMPlayer/iMPlayer_3.m3u
        echo "# Atualizado em $(date)" >> iMPlayer/iMPlayer_3.xml.gz
        echo "# Atualizado em $(date)" >> iMPlayer/iMPlayer_4.m3u
        echo "# Atualizado em $(date)" >> iMPlayer/iMPlayer_5.m3u

    - name: Confirmar arquivos baixados
      run: ls -la iMPlayer

    - name: Verificar mudanças no Git
      id: git_status
      run: |
        if [[ -n "$(git status --porcelain)" ]]; then
          echo "changes=true" >> $GITHUB_ENV
        else
          echo "changes=false" >> $GITHUB_ENV
        fi

    - name: Commit e push do arquivo baixado (se houver mudanças)
      if: env.changes == 'true'
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add iMPlayer/
        git commit -m "Atualização automática dos arquivos baixados (iMPlayer)"
        git pull --rebase origin main
        git push https://x-access-token:${{ secrets.MY_DOWNLOAD_GITHUB_TOKEN }}@github.com/josieljluz/iMPlayer.git main

  playlists_m3u:
    name: Executar playlists.m3u
    if: github.event.schedule == '1 3 1-31/2 * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: implayer  # Opcional: depende da conclusão do job implayer

    steps:
    - name: Checkout repositório
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.8'

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Executar script de playlists.m3u
      run: python playlists.m3u.py

    - name: Atualizar timestamp nos arquivos baixados
      run: |

    - name: Confirmar arquivos baixados
      run: ls -la 

    - name: Verificar mudanças no Git
      id: git_status
      run: |
        if [[ -n "$(git status --porcelain)" ]]; then
          echo "changes=true" >> $GITHUB_ENV
        else
          echo "changes=false" >> $GITHUB_ENV
        fi

    - name: Commit e push do arquivo baixado (se houver mudanças)
      if: env.changes == 'true'
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add .
        git commit -m "Atualização automática dos arquivos baixados (playlists.m3u)"
        git pull --rebase origin main
        git push https://x-access-token:${{ secrets.MY_DOWNLOAD_GITHUB_TOKEN }}@github.com/josieljluz/iMPlayer.git main
