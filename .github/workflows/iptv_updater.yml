name: 🚀 Atualizador Automático de IPTV
description: Workflow para atualização diária de playlists M3U e guias EPG

on:
  # Agendamento de execução (diariamente às 00:01 UTC)
  schedule:
    - cron: '1 0 * * *'
  # Permite acionamento manual na interface do GitHub
  workflow_dispatch:
    inputs:
      force_update:
        description: "Forçar atualização completa?"
        required: false
        default: "false"

env:
  # Configurações globais
  PYTHON_VERSION: '3.10'  # Versão do Python
  WORKING_DIR: 'iptv_data' # Diretório para os arquivos
  COMMIT_MSG: '🔄 Atualização automática de playlists - $(date +"%d/%m/%Y %H:%M")'

jobs:
  atualizar-iptv:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # Timeout para evitar execuções infinitas

    steps:
      # Passo 1: Fazer checkout do repositório
      - name: 🛒 Checkout do código
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Pega todo o histórico para versionamento

      # Passo 2: Configurar Python
      - name: 🐍 Configurar Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'  # Cache para instalação mais rápida

      # Passo 3: Criar diretório de trabalho
      - name: 📂 Criar diretório de trabalho
        run: mkdir -p ${{ env.WORKING_DIR }}

      # Passo 4: Instalar dependências
      - name: 📦 Instalar dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml pytz tqdm

      # Passo 5: Baixar o script atualizador
      - name: 📥 Baixar script atualizador
        run: |
          curl -o ${{ env.WORKING_DIR }}/iptv_updater.py \
          https://raw.githubusercontent.com/seu-usuario/seu-repo/main/iptv_updater.py

      # Passo 6: Executar o atualizador
      - name: 🚀 Executar atualizador IPTV
        run: |
          cd ${{ env.WORKING_DIR }}
          python iptv_updater.py --all --dir .
          # Força atualização se especificado no dispatch
          if [ "${{ github.event.inputs.force_update }}" = "true" ]; then
            python iptv_updater.py --force --all --dir .
          fi

      # Passo 7: Commitar e enviar alterações
      - name: 💾 Salvar alterações
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add ${{ env.WORKING_DIR }}/*
          git commit -m "${{ env.COMMIT_MSG }}" || echo "⚠️ Nenhuma alteração para commitar"
          git push

      # Passo 8: Notificação opcional
      - name: 📢 Notificar status
        if: always()
        uses: actions/github-script@v6
        with:
          script: |
            const core = require('@actions/core')
            try {
              // Aqui pode adicionar notificação para Slack/Discord/etc
              console.log('✅ Workflow concluído com sucesso!')
            } catch (error) {
              core.setFailed('❌ Falha na notificação: ' + error.message)
            }