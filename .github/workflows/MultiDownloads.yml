name: 🆕 Atualização Automática de Playlists M3U

on:
  schedule:
    - cron: '1 0 * * *'  # Diariamente às 00:01 UTC
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  PYTHON_VERSION: '3.10'
  PLAYLISTS_DIR: 'playlists'

jobs:
  update-m3u:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: 🛒 Checkout do repositório
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: 📦 Instalar dependências
        run: |
          python -m pip install --upgrade pip wheel
          pip install requests tqdm
          echo "Dependências instaladas com sucesso!"

      - name: 🗃 Criar diretório de playlists
        run: |
          mkdir -p ${{ env.PLAYLISTS_DIR }}
          echo "Diretório pronto em ./${{ env.PLAYLISTS_DIR }}"

      - name: 🚀 Executar Downloader
        id: downloader
        run: |
          echo "Iniciando processo de download..."
          python MultiDownloads.py \
            --paralelo 4 \
            --timeout 30 \
            --delay 2 \
            --dir ${{ env.PLAYLISTS_DIR }} \
            --log-level INFO

      - name: 💾 Commitar alterações
        id: commit-changes
        run: |
          # Verifica se há mudanças na pasta de playlists
          if git diff --quiet --exit-code -- ${{ env.PLAYLISTS_DIR }}; then
            echo "Não há alterações para commitar"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "Preparando para commitar alterações..."
            git config --global user.name "GitHub Actions Bot"
            git config --global user.email "actions-bot@users.noreply.github.com"
            git add ${{ env.PLAYLISTS_DIR }}
            git commit -m "🔄 Atualização automática de playlists [$(date +'%d/%m/%Y %H:%M')]"
            git push
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📤 Upload de artefatos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m3u-playlists
          path: ${{ env.PLAYLISTS_DIR }}
          retention-days: 7
          compression-level: 9

      - name: 📊 Notificar status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const { data: run } = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId
            });
            
            const status = run.conclusion === 'success' ? '✅ Sucesso' : '❌ Falha';
            const filesUpdated = steps.commit-changes.outputs.has_changes === 'true' ? 'Sim' : 'Não';
            
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### Status: ${status}\n\n` +
                    `- Execução: [${run.html_url}](${run.html_url})\n` +
                    `- Artefatos: [Download](${run.html_url}/artifacts)\n` +
                    `- Arquivos atualizados: ${filesUpdated}`
            });
